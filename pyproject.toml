[project]
name = "llm-explore"
version = "0.1.0"
description = "A small, model-adaptable workspace for exploring LLM neurons."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.6", "transformers>=5.20,<6", "accelerate>=1.0", "sentencepiece>=0.2"]

[project.scripts]
llm-explore = "explorer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explorer*"]

[tool.setuptools.package-data]
explorer = ["static/*"]
